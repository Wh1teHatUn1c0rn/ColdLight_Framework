name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target: the awareness payload is a Windows
        # exe. Linux is included because the assessment half should be
        # portable -- the suite has no platform-specific assertions, and
        # tkinter is imported lazily so a headless runner can still import
        # the payload module.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # The suite stubs every upstream HTTP call, so it must pass with no
        # network access. Nothing here reaches OSV, NVD, CISA or DNS.
        run: python -m pytest

      - name: Check the console script is installed
        run: coldlight --version

  self-scan:
    name: dogfood (scan ColdLight with ColdLight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `scan history` needs the real history. The default shallow
          # checkout is refused rather than reported clean, which is the
          # point of the check -- so the job has to ask for all of it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Static analysis of our own source
        # Excludes the tests (full of deliberate vulnerable fixtures) and the
        # rule definitions themselves, which necessarily contain the patterns
        # they match. --baseline means this fails only on NEW findings, so an
        # accepted backlog does not block the build.
        run: |
          coldlight scan code . \
            --exclude "tests/*" \
            --exclude "coldlight_codescan.py" \
            --baseline .coldlight/baseline.json \
            --fail-on medium

      - name: Secrets in our own git history
        # Excludes the tests, which commit deliberate credential-shaped
        # fixtures. A shallow checkout would make this exit 2, so the
        # fetch-depth above is load-bearing.
        run: |
          coldlight scan history .             --exclude "tests/*"             --fail-on critical
          echo "no committed secrets in reachable history"

      - name: Authorization gate refuses by default
        # The security-critical behaviours, checked end to end through the
        # CLI: an unedited template must be refused, and a target nobody
        # listed must be refused. A regression here would let active probing
        # run unauthorised, so it fails the build rather than warning.
        run: |
          coldlight scope --init /tmp/scope.toml
          if coldlight scope /tmp/scope.toml; then
            echo "FAIL: a placeholder authorization_reference was accepted"
            exit 1
          fi
          sed -i 's/CHANGE-ME-TICKET/CI-SMOKE-1/' /tmp/scope.toml
          sed -i "s|^valid_from.*|valid_from = \"$(date -u -d '-1 day' +%F)\"|" /tmp/scope.toml
          sed -i "s|^valid_until.*|valid_until = \"$(date -u -d '+30 days' +%F)\"|" /tmp/scope.toml
          coldlight scope /tmp/scope.toml
          if coldlight scope /tmp/scope.toml --target https://nobody-listed.example.com; then
            echo "FAIL: an unlisted target was allowed"
            exit 1
          fi
          if coldlight scope /tmp/scope.toml --target https://staging.corp.example.com/api/admin; then
            echo "FAIL: an excluded target was allowed"
            exit 1
          fi
          echo "scope gate refuses placeholders, unlisted and excluded targets"

      - name: AI/ML review of our own source
        # Same exclusions, same reason: coldlight_aisec.py holds the rule table
        # and so contains every pattern it looks for.
        run: |
          coldlight scan ai . \
            --exclude "tests/*" \
            --exclude "coldlight_aisec.py" \
            --fail-on medium

      - name: Preflight reports what it did not check
        # The preflight's core promise is that a dependency nobody looked at
        # is never reported as a healthy one. Run it offline and assert
        # exactly that, so the property is enforced rather than documented.
        # Deliberately network-free: a flaky NVD must not fail our CI.
        run: |
          set -uo pipefail
          status=0
          coldlight doctor --offline --json /tmp/doctor.json > /tmp/doctor.txt || status=$?
          cat /tmp/doctor.txt
          if [ "$status" = "2" ]; then
            echo "FAIL: doctor reports ColdLight cannot run here at all"
            exit 1
          fi
          python -c "
          import json
          d = json.load(open('/tmp/doctor.json'))
          net = [c for c in d['checks'] if c['group'] == 'External services']
          assert net, 'no external services were listed at all'
          bad = [c['name'] for c in net if c['status'] != 'skipped']
          assert not bad, f'an offline run claimed to have checked {bad}'
          assert d['not_checked'], 'an offline run reported nothing unchecked'
          assert d['offline'] is True
          print(f'preflight: {len(net)} services correctly NOT CHECKED')
          "

      - name: An expired indicator never becomes a finding
        # The one property `scan ioc` exists to guarantee, checked end to
        # end through the CLI rather than only in unit tests. The example
        # pack carries a deliberately lapsed indicator; planting its
        # marker in a file must produce an EXPIRED entry and no finding.
        # A regression here would have ColdLight report year-dead intel as
        # live evidence, so it fails the build.
        #
        # Time-stable by construction: that indicator's date is in the
        # past and stays there. It deliberately asserts no indicator
        # COUNTS, which would start failing on their own the day the
        # pack's other dates lapse.
        run: |
          set -euo pipefail
          mkdir -p /tmp/ioctarget
          echo 'STAGE = "/var/tmp/.exampletool-stage"' > /tmp/ioctarget/a.py
          coldlight scan ioc /tmp/ioctarget --pack examples/ioc/example-pack.toml --json /tmp/ioc.json --fail-on low
          python -c "
          import json
          d = json.load(open('/tmp/ioc.json'))
          expired = {f['indicator_id'] for f in d['expired']}
          findings = d['findings']
          assert 'EXAMPLETOOL-STAGER-PATH-2025' in expired, (
              f'the lapsed indicator was not reported as expired: {d}')
          assert not findings, (
              f'an expired indicator was reported as a finding: {findings}')
          assert d['fully_current'] is False
          assert d['coverage_note'], 'a decayed pack reported no caveat'
          print('ioc: expired indicator correctly excluded from findings')
          "

      - name: A weak indicator alone is not a finding, and is promoted when corroborated
        # The second rule `scan ioc` exists for, checked end to end rather
        # than only in unit tests. A class C port is reported as
        # CORROBORATION REQUIRED on its own and must not fail a gate; once a
        # second marker turns up on another surface, the same port becomes a
        # finding that names what corroborated it.
        #
        # Both halves matter. Without the first, a port number raises an
        # alarm on its own; without the second, the rule is just a way to
        # never alert. The second scan also exercises an absolute-path
        # indicator against a relative walk, which is how published packs
        # write dropped-file markers.
        #
        # Deliberately free of backslashes: a continuation or an escape
        # inside a quoted run block does not survive into bash on the runner.
        run: |
          set -euo pipefail
          mkdir -p /tmp/iocweak
          echo 'port: 18788' > /tmp/iocweak/app.yml
          coldlight scan ioc /tmp/iocweak --pack examples/ioc/example-pack.toml --json /tmp/iocalone.json --fail-on low
          mkdir -p /tmp/iocweak/var/tmp
          echo 'payload placeholder' > /tmp/iocweak/var/tmp/.exampletool-agent
          coldlight scan ioc /tmp/iocweak --pack examples/ioc/example-pack.toml --json /tmp/iocboth.json
          python -c "
          import json
          alone = json.load(open('/tmp/iocalone.json'))
          pending = {f['indicator_id'] for f in alone['corroboration_required']}
          lone_findings = alone['findings']
          assert 'EXAMPLETOOL-CALLBACK-PORT' in pending, (
              f'a class C port did not wait for corroboration: {alone}')
          assert not lone_findings, (
              f'a port number alone was reported as a finding: {lone_findings}')
          both = json.load(open('/tmp/iocboth.json'))
          by_id = {f['indicator_id']: f for f in both['findings']}
          assert 'EXAMPLETOOL-DROPPED-AGENT' in by_id, (
              f'an absolute-path indicator never matched a relative walk: {both}')
          port = by_id.get('EXAMPLETOOL-CALLBACK-PORT')
          assert port is not None, f'a corroborated port was not promoted: {both}'
          assert port['corroborated_by'], 'a promoted finding named no corroborator'
          uncovered = both['surfaces_uncovered']
          assert uncovered == [], f'the shipped pack left a surface uncovered: {uncovered}'
          print('ioc: corroboration gate holds in both directions')
          "

      - name: An indicator match reaches the deliverable as a third party's grade
        # The wiring, through the CLI rather than in-process: the stage runs,
        # its matches reach the report as their own category, and the severity
        # is counted as a carried grade rather than as ColdLight's own.
        #
        # The second half is the one that matters most. A pack whose every
        # indicator has expired must FAIL the stage and exit 2: the scan ran,
        # but nothing current was looked for, and a zero-finding report of
        # that run is indistinguishable from a clean tree.
        #
        # Deliberately free of backslashes: a continuation or an escape
        # inside a quoted run block does not survive into bash on the runner.
        run: |
          set -euo pipefail
          mkdir -p /tmp/iocwire/var/tmp
          echo 'payload placeholder' > /tmp/iocwire/var/tmp/.exampletool-agent
          echo 'port: 18788' > /tmp/iocwire/app.yml
          printf 'exampletool placeholder artifact\n' > /tmp/iocwire/renamed.dat
          coldlight assess --ioc /tmp/iocwire --ioc-pack examples/ioc/example-pack.toml --client CI --title "CI wiring check" --format json --out-dir /tmp/iocassess --no-preflight --quiet
          python -c "
          import json
          report = json.load(open('/tmp/iocassess/report.json'))
          categories = {f['category'] for f in report['findings']}
          assert 'Known-tool indicators' in categories, (
              f'indicator findings did not reach the report: {categories}')
          assert report['severities_third_party'] >= 1, report['severity_provenance']
          buckets = (report['severities_measured']
                     + report['severities_third_party']
                     + report['severities_assessed_by_coldlight'])
          assert buckets == report['finding_count'], (
              f'the provenance buckets do not add up: {report}')
          notes = ' '.join(report['not_assessed'])
          assert 'not absence of compromise' in notes, notes
          found = {f['identifiers'][0] for f in report['findings'] if f['identifiers']}
          assert 'EXAMPLETOOL-WEBSHELL-DIGEST' in found, (
              f'the digest surface did not match a renamed artifact: {found}')
          run = json.load(open('/tmp/iocassess/run.json'))
          stages = {s['name']: s['status'] for s in run['stages']}
          assert stages.get('indicators') == 'ok', stages
          ledger = json.load(open('/tmp/iocassess/assurance.json'))
          entry = [e for e in ledger['entries'] if e['key'] == 'ioc'][0]
          assert entry['status'] in ('ASSESSED', 'PARTIAL'), entry
          assert entry['total'] >= entry['checked'] >= 1, entry
          print('ioc: the stage reaches the deliverable; ledger says', entry['status'])
          "
          sed -E 's/^valid_until = .*/valid_until = "2020-01-01"/' examples/ioc/example-pack.toml > /tmp/lapsed-pack.toml
          grep -c 'valid_until = "2020-01-01"' /tmp/lapsed-pack.toml
          set +e
          coldlight assess --ioc /tmp/iocwire --ioc-pack /tmp/lapsed-pack.toml --client CI --format json --out-dir /tmp/ioclapsed --no-preflight --quiet
          code=$?
          set -e
          test "$code" = "2" || { echo "an all-expired pack did not fail the run (exit $code)"; exit 1; }
          python -c "
          import json
          run = json.load(open('/tmp/ioclapsed/run.json'))
          stage = {s['name']: s for s in run['stages']}['indicators']
          assert stage['status'] == 'failed', stage
          assert 'expired' in stage['error'], stage
          assert run['incomplete'] is True, run
          report = json.load(open('/tmp/ioclapsed/report.json'))
          assert not report['findings'], report['findings']
          notes = ' '.join(report['not_assessed'])
          assert 'indicators stage FAILED' in notes, notes
          ledger = json.load(open('/tmp/ioclapsed/assurance.json'))
          entry = [e for e in ledger['entries'] if e['key'] == 'ioc'][0]
          assert entry['status'] == 'FAILED', entry
          print('ioc: an all-expired pack fails the run instead of reading clean')
          "

      - name: A STIX bundle becomes a pack the scanner can load and use
        # The chain the importer exists for, end to end: bundle -> pack ->
        # loader -> scan -> finding. The refusal count is asserted too,
        # because an importer that silently widened its scope would still
        # produce a pack that loads, and that is the failure nobody notices.
        #
        # Deliberately one backslash in the whole step, in the printf: a
        # continuation or an escape inside a quoted run block does not survive
        # into bash on the runner.
        run: |
          set -euo pipefail
          coldlight ioc import examples/ioc/example-bundle.json --out /tmp/probekit.toml --json /tmp/probekit-import.json
          python -c "
          import json
          report = json.load(open('/tmp/probekit-import.json'))
          assert report['imported'] == 5, report
          assert report['refused'] == 7, report['refusals_by_reason']
          reasons = ' '.join(report['refusals_by_reason'])
          for expected in ('network address', 'DNS', 'compound', 'sigma', 'MD5', 'account', 'no basis'):
              assert expected in reasons, (expected, reasons)
          kinds = sorted({e['kind'] for e in report['entries']})
          assert kinds == ['file_digest', 'file_name', 'listening_port'], kinds
          assert report['already_expired'] == 1, report['already_expired']
          print('stix: 5 imported, 7 refused with reasons')
          "
          mkdir -p /tmp/probekit/var/tmp
          echo 'placeholder' > /tmp/probekit/var/tmp/.probekit-implant
          printf 'exampletool placeholder artifact\n' > /tmp/probekit/renamed.dat
          echo '#!/bin/sh' > /tmp/probekit/probekit-42.sh
          echo 'not anchored' > /tmp/probekit/probekit-notes.sh
          echo 'port: 19099' > /tmp/probekit/app.yml
          coldlight scan ioc /tmp/probekit --pack /tmp/probekit.toml --json /tmp/probekit-scan.json
          python -c "
          import json
          scan = json.load(open('/tmp/probekit-scan.json'))
          found = {f['indicator_id'] for f in scan['findings']}
          for expected in ('PROBEKIT-IMPLANT-ON-DISK', 'PROBEKIT-DROPPER-BY-CONTENT-HASH', 'PROBEKIT-STAGED-SCRIPT-NAME'):
              assert expected in found, (expected, found)
          evidence = ' '.join(f['snippet'] for f in scan['findings'])
          assert 'probekit-notes.sh' not in evidence, (
              'the anchored regex matched an unanchored name: ' + evidence)
          port = [f for f in scan['findings'] if f['indicator_id'] == 'PROBEKIT-CONSOLE-PORT']
          assert port and port[0]['corroborated_by'], (
              'the port imported with the uniqueness default was not promoted: ' + str(port))
          assert scan['surfaces_uncovered'] == ['file_content', 'container_image'], (
              scan['surfaces_uncovered'])
          print('stix: the imported pack found every planted marker')
          "

      - name: A pipeline that leaks a secret and a pod that mounts the node are findings
        # These two behaviours came from a published intrusion, and are rules
        # rather than indicators precisely so they keep working after the
        # indicators expire. The repository itself contains none of these
        # patterns, so the self-scan above proves nothing about them: they
        # need planted input.
        #
        # The decode assertion is the one that matters most. `base64 -d` pulls
        # a stored binary secret INTO a job, which is how a GPG key or a
        # keystore is normally carried, and a rule that fired on it would be
        # switched off within a day.
        run: |
          set -euo pipefail
          mkdir -p /tmp/cirules
          echo 'jobs:' > /tmp/cirules/leaky.yml
          echo '  build:' >> /tmp/cirules/leaky.yml
          echo '    steps:' >> /tmp/cirules/leaky.yml
          echo '      - run: echo "$DEPLOY_TOKEN" | base64' >> /tmp/cirules/leaky.yml
          echo '      - run: env | base64' >> /tmp/cirules/leaky.yml
          echo '      - run: echo "$DEPLOY_TOKEN" | base64 -d > key.gpg' >> /tmp/cirules/leaky.yml
          echo 'spec:' > /tmp/cirules/pod.yaml
          echo '  containers:' >> /tmp/cirules/pod.yaml
          echo '    - securityContext:' >> /tmp/cirules/pod.yaml
          echo '        privileged: true' >> /tmp/cirules/pod.yaml
          echo '  volumes:' >> /tmp/cirules/pod.yaml
          echo '    - hostPath:' >> /tmp/cirules/pod.yaml
          echo '        path: /' >> /tmp/cirules/pod.yaml
          echo 'services:' > /tmp/cirules/compose.yml
          echo '  runner:' >> /tmp/cirules/compose.yml
          echo '    volumes:' >> /tmp/cirules/compose.yml
          echo '      - "/var/run/docker.sock:/var/run/docker.sock"' >> /tmp/cirules/compose.yml
          coldlight scan code /tmp/cirules --json /tmp/cirules.json
          python -c "
          import json
          scan = json.load(open('/tmp/cirules.json'))
          found = {f['rule_id'] for f in scan['findings']}
          for expected in ('CI-SECRET-ENCODED', 'CI-ENV-DUMP', 'CONTAINER-PRIVILEGED', 'CONTAINER-HOST-MOUNT', 'CONTAINER-RUNTIME-SOCKET'):
              assert expected in found, (expected, sorted(found))
          encoded = [f for f in scan['findings'] if f['rule_id'] == 'CI-SECRET-ENCODED']
          assert len(encoded) == 1, (
              'the decode form was reported as a leak: '
              + str([(f['line'], f['snippet']) for f in encoded]))
          assert encoded[0]['line'] == 4, encoded[0]
          assert 'REDACTED' in encoded[0]['snippet'], encoded[0]['snippet']
          print('ci rules: five planted misconfigurations found, decode form ignored')
          "

  standalone:
    name: single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and verify the single-file bundle
        # --verify proves three things: extraction is byte-identical to the
        # repository sources, those extracted sources pass the entire test
        # suite, and the resulting one-file CLI actually runs.
        run: python build_bundle.py --verify

      - name: Confirm it runs with no dependencies at all
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python -m pip uninstall -y pip setuptools 2>/dev/null || true
          python -m venv --without-pip /tmp/nodeps
          /tmp/nodeps/bin/python dist/coldlight-standalone.py --version
          /tmp/nodeps/bin/python dist/coldlight-standalone.py scan code . \
            --exclude "tests/*" --exclude "coldlight_codescan.py" >/dev/null
          /tmp/nodeps/bin/python dist/coldlight-standalone.py scan ai . \
            --exclude "tests/*" --exclude "coldlight_aisec.py" >/dev/null
          /tmp/nodeps/bin/python dist/coldlight-standalone.py detect map >/dev/null
          echo "single file runs on an interpreter with nothing installed"

      - uses: actions/upload-artifact@v7
        with:
          name: coldlight-standalone
          path: dist/coldlight-standalone.py

  build-sdist-wheel:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify/bin/coldlight --version
          /tmp/verify/bin/coldlight scan code . --exclude "tests/*" --exclude "coldlight_codescan.py" >/dev/null
          echo "wheel installs and the CLI runs with no dev dependencies"

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
